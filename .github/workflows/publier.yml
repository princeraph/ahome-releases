# Publie une version d'Ahome : construit l'installateur Windows depuis le code source (dépôt privé, lu avec un jeton
# en lecture seule), seulement si TOUS les contrôles du code sont verts, puis crée la version v<version> ici, avec
# Ahome-Setup.exe, son .blockmap et latest.yml (que l'appli installée lit pour se mettre à jour).
#
# Coût : ce dépôt est public, les minutes des exécuteurs GitHub standard y sont gratuites et ne comptent pas dans
# le quota des dépôts privés. Estimation : ~30 min × 1 (Linux) × ~4 publications par mois ≈ 120 min/mois, non
# facturées. Lancé à la main seulement (workflow_dispatch) : aucun envoi de branche ne le déclenche.
#
# Secrets attendus (Réglages du dépôt › Secrets and variables › Actions) :
#   AHOME_SOURCE_REPO   « propriétaire/nom » du dépôt du code source
#   AHOME_SOURCE_TOKEN  jeton à grain fin, lecture seule du contenu de ce seul dépôt
name: Publier une version

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branche, étiquette ou commit du code source à publier
        required: true
        default: main

concurrency:
  group: publier
  # Coupée en route, une publication laisserait une version à moitié téléversée.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Pages de ce dépôt (règle du lien d'invitation)
        uses: actions/checkout@v4
        with:
          path: pages
          persist-credentials: false

      - name: Code source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AHOME_SOURCE_REPO }}
          token: ${{ secrets.AHOME_SOURCE_TOKEN }}
          ref: ${{ inputs.ref }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version à publier
        id: version
        working-directory: source
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version inattendue : $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuser une version déjà publiée
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::La version v$VERSION existe déjà. Augmentez la version dans le code source."
            exit 1
          fi

      # NSIS sous Linux : wine 32 bits (le désinstallateur est généré en exécutant le stub 32 bits) ; 7z pour la
      # vérification de l'installateur livré.
      - name: wine32 et 7z
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine wine64 wine32:i386 p7zip-full > /dev/null
          WINEDEBUG=-all wineboot --init

      - name: Dépendances
        working-directory: source
        run: |
          npm ci
          npx install-electron

      - name: Contrôles (la publication ne part que si tout est vert)
        working-directory: source
        run: npm run check

      - name: Même règle du lien d'invitation ici et dans l'appli
        env:
          AHOME_SOURCE: ${{ github.workspace }}/source
        run: node --test pages/tests/regle.test.mjs

      - name: "Installateur Windows, vérifié (désinstallateur, latest.yml, app-update.yml)"
        working-directory: source
        run: npm run package:win-depuis-linux -w @ahome/desktop

      - name: Publier v${{ steps.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: source/apps/desktop/release
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ahome $VERSION" \
            --notes "Installateur Windows d'Ahome $VERSION. Non signé : si Windows affiche « Windows a protégé votre ordinateur », cliquez sur Informations complémentaires, puis Exécuter quand même. Les appareils où Ahome est déjà installée se mettent à jour seuls." \
            Ahome-Setup.exe Ahome-Setup.exe.blockmap latest.yml
